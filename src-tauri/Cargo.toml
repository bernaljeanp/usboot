[package]
name = "usboot"
version = "0.1.0"
description = "USBoot - a tiny, honest USB image writer"
authors = ["USBoot contributors"]
license = "Apache-2.0"
edition = "2024"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519)
name = "usboot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
sha2 = "0.10"
regex = "1"
sys-locale = "0.3"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
